<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comdb2 Architecture</title>
<style>
/* ===== DESIGN SYSTEM ===== */
:root {
  --bg: #f8fafb;
  --bg-top: rgba(37, 99, 235, 0.02);
  --card: #ffffff;
  --card-footer: #f9fafb;
  --bdr: #e5e9f0;
  --text: #2d3748;
  --dim: #8896a7;
  --bright: #111827;
  --shadow-card: 0 2px 4px rgba(0,0,0,.02), 0 12px 28px rgba(0,0,0,.045), 0 28px 64px rgba(0,0,0,.04);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.03);
  --code-bg: #f0f4f8;
  --code-c: #5046e5;
  --blue: #2563eb; --bluel: rgba(37,99,235,.06); --blueg: rgba(37,99,235,.22);
  --cyan: #0891b2; --cyanl: rgba(8,145,178,.06); --cyang: rgba(8,145,178,.22);
  --purple: #7c3aed; --purplel: rgba(124,58,237,.06); --purpleg: rgba(124,58,237,.22);
  --amber: #d97706; --amberl: rgba(217,119,6,.06); --amberg: rgba(217,119,6,.22);
  --red: #dc2626; --redl: rgba(220,38,38,.06); --redg: rgba(220,38,38,.22);
  --green: #16a34a; --greenl: rgba(22,163,74,.06); --greeng: rgba(22,163,74,.22);
  --teal: #0d9488; --teall: rgba(13,148,136,.06); --tealg: rgba(13,148,136,.22);
  --pink: #db2777; --pinkl: rgba(219,39,119,.06); --pinkg: rgba(219,39,119,.22);
  --indigo: #4f46e5; --indigol: rgba(79,70,229,.06); --indigog: rgba(79,70,229,.22);

  --svg-client-fill: rgba(37,99,235,.06);
  --svg-client-stroke: rgba(37,99,235,.35);
  --svg-server-fill: rgba(124,58,237,.03);
  --svg-server-stroke: rgba(124,58,237,.2);
  --svg-box-fill: var(--card);
  --svg-box-stroke: var(--bdr);
  --svg-arrow: var(--dim);
  --svg-label: var(--dim);
  --svg-text: var(--bright);
  --svg-subtext: var(--text);
}

:root.dark {
  --bg: #0b1222;
  --bg-top: rgba(59, 130, 246, 0.03);
  --card: #14202f;
  --card-footer: #111c2b;
  --bdr: #1e3050;
  --text: #c4d0dc;
  --dim: #607080;
  --bright: #ecf2f8;
  --shadow-card: 0 2px 4px rgba(0,0,0,.2), 0 12px 28px rgba(0,0,0,.25), 0 28px 64px rgba(0,0,0,.2);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
  --code-bg: rgba(80, 70, 229, .12);
  --code-c: #a5b4fc;
  --blue: #3b82f6; --bluel: rgba(59,130,246,.1); --blueg: rgba(59,130,246,.3);
  --cyan: #06b6d4; --cyanl: rgba(6,182,212,.1); --cyang: rgba(6,182,212,.3);
  --purple: #a855f7; --purplel: rgba(168,85,247,.1); --purpleg: rgba(168,85,247,.3);
  --amber: #f59e0b; --amberl: rgba(245,158,11,.1); --amberg: rgba(245,158,11,.3);
  --red: #ef4444; --redl: rgba(239,68,68,.1); --redg: rgba(239,68,68,.3);
  --green: #22c55e; --greenl: rgba(34,197,94,.1); --greeng: rgba(34,197,94,.3);
  --teal: #14b8a6; --teall: rgba(20,184,166,.1); --tealg: rgba(20,184,166,.3);
  --pink: #ec4899; --pinkl: rgba(236,72,153,.1); --pinkg: rgba(236,72,153,.3);
  --indigo: #818cf8; --indigol: rgba(129,140,248,.1); --indigog: rgba(129,140,248,.3);

  --svg-client-fill: rgba(59,130,246,.08);
  --svg-client-stroke: rgba(59,130,246,.3);
  --svg-server-fill: rgba(168,85,247,.05);
  --svg-server-stroke: rgba(168,85,247,.2);
  --svg-box-fill: #182435;
  --svg-box-stroke: #243552;
  --svg-arrow: #506070;
  --svg-label: #607080;
  --svg-text: #ecf2f8;
  --svg-subtext: #a0b0c0;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  transition: background .3s, color .3s;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 500px;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-top), transparent);
  pointer-events: none;
  z-index: 0;
}

code {
  font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  background: var(--code-bg);
  color: var(--code-c);
  padding: 2px 7px;
  border-radius: 5px;
  font-size: .84em;
  font-weight: 500;
}

.hdr {
  text-align: center;
  padding: 48px 24px 14px;
  position: relative;
  z-index: 1;
}
.hdr h1 {
  font-size: 2rem;
  color: var(--bright);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.2;
}
.hdr h1 em { color: var(--blue); font-style: normal; }
.hdr .sub {
  color: var(--dim);
  font-size: .9em;
  margin-top: 8px;
  line-height: 1.6;
  font-weight: 400;
}
.tbtn {
  position: absolute;
  top: 40px;
  right: 28px;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--bdr);
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15em;
  color: var(--text);
  transition: all .2s cubic-bezier(.4,0,.2,1);
  box-shadow: var(--shadow-sm);
}
.tbtn:hover {
  border-color: var(--blue);
  color: var(--blue);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm), 0 4px 12px var(--blueg);
}

/* ===== TRACE CONTROLS ===== */
.trace-bar {
  max-width: 960px;
  margin: 16px auto 0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}
.trace-label {
  font-size: .76em;
  font-weight: 600;
  color: var(--dim);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.trace-btn {
  background: var(--card);
  border: 1px solid var(--bdr);
  color: var(--text);
  padding: 7px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: .78em;
  font-family: inherit;
  font-weight: 600;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}
.trace-btn:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: var(--bluel);
  transform: translateY(-1px);
}
.trace-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  box-shadow: 0 2px 8px var(--blueg);
}
.trace-btn.stop {
  border-color: var(--red);
  color: var(--red);
}
.trace-btn.stop:hover {
  background: var(--redl);
  border-color: var(--red);
  color: var(--red);
}
.trace-progress {
  font-size: .72em;
  color: var(--dim);
  font-weight: 500;
  min-width: 80px;
}

/* ===== MAIN CONTAINER ===== */
.main-container {
  max-width: 1400px;
  margin: 14px auto 0;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1fr 350px;
  gap: 20px;
  position: relative;
  z-index: 1;
  min-height: 80vh;
}

/* ===== DIAGRAM ===== */
.diagram-wrap {
  position: relative;
}
.diagram-card {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  padding: 28px 20px 20px;
  overflow: hidden;
}

.arch-box {
  cursor: pointer;
  transition: all .25s cubic-bezier(.4,0,.2,1);
}
.arch-box:hover rect {
  filter: brightness(1.02);
  stroke-width: 2;
}
.arch-box.active rect {
  stroke-width: 2.5;
}
.arch-box.glow {
  animation: trace-pulse 1s ease-in-out infinite;
}
.arch-box.glow rect {
  stroke-width: 3;
}
@keyframes trace-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .7; }
}

/* Per-color glow filters applied via data attribute during trace */
.arch-box.glow[data-color="blue"] rect { filter: drop-shadow(0 0 12px rgba(37,99,235,.6)); stroke: var(--blue); }
.arch-box.glow[data-color="cyan"] rect { filter: drop-shadow(0 0 12px rgba(8,145,178,.6)); stroke: var(--cyan); }
.arch-box.glow[data-color="purple"] rect { filter: drop-shadow(0 0 12px rgba(124,58,237,.6)); stroke: var(--purple); }
.arch-box.glow[data-color="amber"] rect { filter: drop-shadow(0 0 12px rgba(217,119,6,.6)); stroke: var(--amber); }
.arch-box.glow[data-color="red"] rect { filter: drop-shadow(0 0 12px rgba(220,38,38,.6)); stroke: var(--red); }
.arch-box.glow[data-color="green"] rect { filter: drop-shadow(0 0 12px rgba(22,163,74,.6)); stroke: var(--green); }
.arch-box.glow[data-color="teal"] rect { filter: drop-shadow(0 0 12px rgba(13,148,136,.6)); stroke: var(--teal); }
.arch-box.glow[data-color="pink"] rect { filter: drop-shadow(0 0 12px rgba(219,39,119,.6)); stroke: var(--pink); }
.arch-box.glow[data-color="indigo"] rect { filter: drop-shadow(0 0 12px rgba(79,70,229,.6)); stroke: var(--indigo); }
.arch-box.glow[data-color="dim"] rect { filter: drop-shadow(0 0 12px rgba(136,150,167,.6)); }

.path-flash {
  animation: path-pulse 1.2s ease-in-out infinite;
}
@keyframes path-pulse {
  0%, 100% { stroke-width: 1.5; opacity: 0.7; }
  50% { stroke-width: 2.5; opacity: 1; filter: drop-shadow(0 0 6px rgba(13,148,136,.8)); }
}

#read-path-visual.animate,
#write-path-visual.animate {
  stroke-dashoffset: 0 !important;
}

/* ===== TOOLTIP ===== */
.tooltip {
  position: fixed;
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 10px;
  padding: 8px 14px;
  box-shadow: var(--shadow-card);
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity .15s;
  max-width: 260px;
}
.tooltip.show { opacity: 1; }
.tooltip-title {
  font-size: .82em;
  font-weight: 700;
  color: var(--bright);
  margin-bottom: 2px;
}
.tooltip-desc {
  font-size: .74em;
  color: var(--dim);
  line-height: 1.5;
}

/* ===== DETAIL PANEL ===== */
.detail-wrap {
  position: sticky;
  top: 14px;
  height: fit-content;
  max-height: calc(100vh - 28px);
}
.detail-panel {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  transition: all .3s cubic-bezier(.4,0,.2,1);
}
.detail-panel.hidden {
  opacity: 0;
  pointer-events: none;
}
.detail-top {
  position: relative;
  height: 3px;
  transition: background .3s;
}
.detail-body {
  padding: 28px 20px 32px;
  overflow-y: auto;
  flex: 1;
  font-size: .9em;
}
.detail-phase {
  font-size: .67em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 4px 12px;
  border-radius: 6px;
  display: inline-block;
  margin-bottom: 12px;
}
.detail-body h2 {
  font-size: 1.4em;
  color: var(--bright);
  font-weight: 750;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  line-height: 1.3;
}
.detail-body p {
  font-size: .93em;
  line-height: 1.8;
  margin-bottom: 12px;
  color: var(--text);
}
.detail-body p:last-child { margin-bottom: 0; }
.detail-body .callout {
  margin: 18px 0 8px;
  padding: 16px 20px;
  border-radius: 12px;
  font-size: .93em;
  line-height: 1.7;
  border-left: 3.5px solid var(--accent, var(--blue));
  background: var(--accentl, var(--bluel));
}
.detail-body .callout strong { color: var(--accent, var(--blue)); }

footer {
  text-align: center;
  padding: 28px 24px 36px;
  font-size: .74em;
  color: var(--dim);
  max-width: 960px;
  margin: 20px auto 0;
  position: relative;
  z-index: 1;
}
footer a { color: var(--blue); text-decoration: none; font-weight: 500; }
footer a:hover { text-decoration: underline; }
.keys { margin-bottom: 8px; font-weight: 500; }
.keys kbd {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 5px;
  padding: 3px 7px;
  font-family: inherit;
  font-size: .92em;
  margin: 0 2px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}

/* ===== MOBILE DRAWER ===== */
.detail-drawer {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 70vh;
  background: var(--card);
  border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow-card);
  z-index: 200;
  overflow: hidden;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  transform: translateY(100%);
  display: flex;
  flex-direction: column;
}
.detail-drawer.show {
  transform: translateY(0);
}
.detail-drawer-handle {
  display: none;
  width: 40px;
  height: 4px;
  background: var(--bdr);
  border-radius: 2px;
  margin: 12px auto 8px;
  cursor: grab;
}
.detail-drawer-handle:active { cursor: grabbing; }
.detail-drawer-body {
  overflow-y: auto;
  flex: 1;
  padding: 16px 20px 20px;
  font-size: .9em;
}
.detail-drawer-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--bdr);
  border-radius: 8px;
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2em;
  color: var(--dim);
  transition: all .2s;
  z-index: 10;
}
.detail-drawer-close:hover {
  color: var(--text);
  border-color: var(--text);
}

@media (max-width: 1024px) {
  .main-container {
    grid-template-columns: 1fr;
    min-height: auto;
    gap: 0;
  }
  .detail-wrap {
    position: static;
    display: none;
  }
  .detail-drawer {
    display: flex;
  }
  .detail-drawer-handle {
    display: block;
  }
}

@media (max-width: 640px) {
  .hdr { padding: 36px 16px 10px; }
  .hdr h1 { font-size: 1.4em; }
  .tbtn { top: 28px; right: 14px; width: 34px; height: 34px; border-radius: 10px; }
  .diagram-wrap, .trace-bar { padding: 0 12px; }
  .main-container { padding: 0 12px; }
  .diagram-card { padding: 16px 8px 12px; border-radius: 14px; }
  .trace-bar { flex-wrap: wrap; gap: 6px; }
}
</style>
</head>
<body>

<div class="hdr">
  <h1><em>Comdb2</em> Architecture</h1>
  <p class="sub">Interactive component diagram &mdash; click any box to explore</p>
  <button class="tbtn" onclick="toggleTheme()" id="tbtn" title="Toggle theme">&#9790;</button>
</div>

<div class="trace-bar">
  <span class="trace-label">Trace:</span>
  <button class="trace-btn" id="trace-read" onclick="startTrace('read')">&#9654; Read Path</button>
  <button class="trace-btn" id="trace-write" onclick="startTrace('write')">&#9654; Write Path</button>
  <button class="trace-btn stop" id="trace-stop" onclick="stopTrace()" style="display:none">&#9724; Stop</button>
  <span class="trace-progress" id="trace-progress"></span>
</div>

<div class="main-container">
<div class="diagram-wrap">
<div class="diagram-card">
<svg viewBox="0 0 880 850" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;" id="arch-svg">
  <defs>
    <g id="read-path-group" style="display:none; pointer-events:none">
      <path id="read-path-visual" d="M137,107 L137,152 L440,152 L440,112 L440,176 L440,241 L440,301 L440,344 L440,388 L380,436 L320,588"
            fill="none" stroke="rgb(59,130,246)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1000" stroke-dashoffset="1000" style="transition: stroke-dashoffset 0.6s ease-out; opacity: 0.7"/>
    </g>
    <g id="write-path-group" style="display:none; pointer-events:none">
      <path id="write-path-visual" d="M137,107 L137,152 L440,152 L440,112 L440,176 L440,241 L440,301 L440,344 L440,388 L440,436 L497,548 L757,738 L757,750"
            fill="none" stroke="rgb(220,38,38)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1000" stroke-dashoffset="1000" style="transition: stroke-dashoffset 0.6s ease-out; opacity: 0.7"/>
    </g>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--svg-arrow)" stroke-width="1.2"/>
    </marker>
    <marker id="ah-both" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="var(--svg-arrow)" stroke-width="1.2"/>
    </marker>
    <marker id="ah-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--amber)" stroke-width="1.2"/>
    </marker>
    <marker id="ah-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--red)" stroke-width="1.2"/>
    </marker>
    <marker id="ah-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--purple)" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ===== CLIENT REGION ===== -->
  <rect x="30" y="18" width="820" height="145" rx="14"
        fill="var(--svg-client-fill)" stroke="var(--svg-client-stroke)" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="52" y="40" font-size="11" font-weight="700" fill="var(--svg-label)" letter-spacing=".08em">CLIENT PROCESS</text>

  <!-- Application -->
  <g class="arch-box" data-id="app" data-color="blue" onclick="sel('app')">
    <rect x="60" y="55" width="155" height="52" rx="10"
          fill="var(--svg-box-fill)" stroke="var(--blue)" stroke-width="1.5"/>
    <text x="137" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="var(--svg-text)">Application</text>
    <text x="137" y="93" text-anchor="middle" font-size="10" fill="var(--svg-subtext)">SQL queries &amp; txns</text>
  </g>

  <!-- cdb2api -->
  <g class="arch-box" data-id="cdb2api" data-color="blue" onclick="sel('cdb2api')">
    <rect x="290" y="50" width="300" height="62" rx="10"
          fill="var(--svg-box-fill)" stroke="var(--blue)" stroke-width="1.5"/>
    <text x="440" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)">cdb2api</text>
    <text x="440" y="92" text-anchor="middle" font-size="10" fill="var(--svg-subtext)">client library &bull; discovery &bull; HASQL failover &bull; protobuf</text>
  </g>

  <!-- sockpool -->
  <g class="arch-box" data-id="sockpool" data-color="cyan" onclick="sel('sockpool')">
    <rect x="665" y="55" width="155" height="52" rx="10"
          fill="var(--svg-box-fill)" stroke="var(--cyan)" stroke-width="1.5"/>
    <text x="742" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="var(--cyan)">sockpool</text>
    <text x="742" y="93" text-anchor="middle" font-size="10" fill="var(--svg-subtext)">connection cache</text>
  </g>

  <!-- Arrows: App -> cdb2api -->
  <line x1="215" y1="81" x2="286" y2="81" stroke="var(--svg-arrow)" stroke-width="1.3" marker-end="url(#ah)"/>
  <!-- cdb2api <-> sockpool -->
  <line x1="590" y1="81" x2="661" y2="81" stroke="var(--svg-arrow)" stroke-width="1.3" marker-end="url(#ah)" marker-start="url(#ah-both)"/>

  <!-- Service Discovery -->
  <g class="arch-box" data-id="discovery" data-color="blue" onclick="sel('discovery')">
    <rect x="320" y="120" width="240" height="34" rx="8"
          fill="var(--svg-box-fill)" stroke="var(--blue)" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="440" y="142" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--blue)">Service Discovery (Consul / comdb2db)</text>
  </g>
  <line x1="440" y1="112" x2="440" y2="118" stroke="var(--svg-arrow)" stroke-width="1" marker-end="url(#ah)"/>

/* ===== COMPONENT DATA ===== */
const info = {
  app: {
    color: 'var(--blue)', bg: 'var(--bluel)', label: 'Client',
    title: 'Application', tip: 'Issues SQL queries through cdb2api',
    body: `<p>The application issues SQL queries through the <code>cdb2api</code> client library. It calls <code>cdb2_run_statement()</code> or <code>cdb2_run_statement_typed()</code> for parameterized queries, then iterates results with <code>cdb2_next_record()</code>.</p>
<p>The application is completely shielded from cluster topology, failover, and connection management &mdash; <code>cdb2api</code> handles all of that transparently. From the application's perspective, Comdb2 looks like a single reliable database endpoint.</p>
<div class="callout"><strong>Language-agnostic.</strong> While <code>cdb2api</code> is the reference C library, the wire protocol is pure protobuf over TCP. Clients in Python, Java, Go, or any language with protobuf support can talk to Comdb2 directly.</div>`
  },
  cdb2api: {
    color: 'var(--blue)', bg: 'var(--bluel)', label: 'Client Library',
    title: 'cdb2api', tip: 'Client library: discovery, connection, failover, protobuf serialization',
    body: `<p><code>cdb2api</code> is the client-side library that manages the full lifecycle of database communication: service discovery, connection management, query serialization, result deserialization, and transparent failover.</p>
<p><strong>Service Discovery</strong> &mdash; locates cluster nodes via Consul DNS (SRV/A records), the <code>comdb2db</code> meta-database, or static config files. Results are cached with configurable TTL.</p>
<p><strong>Node Selection</strong> &mdash; for reads, <code>cdb2api</code> uses proximity-aware routing to pick a node in the same data center. The read is served from any live node with a snapshot-isolated view. For writes, <code>cdb2api</code> routes to the master; if connected to a replicant, osql transparently forwards the write to the master.</p>
<p><strong>Wire Protocol</strong> &mdash; queries are serialized as <code>CDB2_SQLQUERY</code> protobuf messages with SQL text, bind parameters, and authentication credentials. Responses arrive as streamed <code>CDB2_SQLRESPONSE</code> messages.</p>
<p><strong>HASQL Failover</strong> &mdash; if the connected node fails mid-transaction, <code>cdb2api</code> detects the failure (via <code>is_retryable()</code>, checking for I/O errors or disconnect), picks another available node, and transparently replays the transaction from the last checkpoint. A unique transaction ID (uuid) prevents duplicate writes in case of ambiguous commit failures.</p>`
  },
  sockpool: {
    color: 'var(--cyan)', bg: 'var(--cyanl)', label: 'Connection Cache',
    title: 'sockpool', tip: 'Per-machine daemon caching idle TCP connections for reuse',
    body: `<p><strong>sockpool</strong> is a per-machine connection cache daemon that stores idle TCP connections for reuse across queries. When a query completes, the connection is returned to sockpool instead of being closed.</p>
<p>On the next query, <code>cdb2api</code> first checks sockpool for an existing connection to the target database. A cache hit avoids TCP handshake, SSL/TLS negotiation, and server-side session setup &mdash; reducing latency from tens of milliseconds to microseconds.</p>
<p>sockpool manages connection lifetimes, evicts stale connections, and handles multiple databases simultaneously. It is shared across all applications on the same machine, so different processes can benefit from connections established by others.</p>
<div class="callout"><strong>Why a separate daemon?</strong> Connection pooling at the process level doesn't survive process restarts and can't share connections across unrelated applications. sockpool runs as a system service, maximizing connection reuse across the entire machine.</div>`
  },
  discovery: {
    color: 'var(--blue)', bg: 'var(--bluel)', label: 'Discovery',
    title: 'Service Discovery', tip: 'Locates cluster nodes via Consul DNS, comdb2db, or static config',
    body: `<p>Comdb2 uses a tiered discovery strategy to locate all nodes in a database cluster:</p>
<p><strong>Consul DNS</strong> &mdash; the primary mechanism. SRV record lookups return a prioritized host list with ports. A records resolve IP addresses. Consul enables proximity-aware routing by encoding data center locality in the service registration.</p>
<p><strong>comdb2db</strong> &mdash; a meta-database that maintains a registry of all Comdb2 clusters and their current membership. Used as a fallback when Consul is unavailable.</p>
<p><strong>Static config</strong> &mdash; a configuration file with an explicit host list, used as a last resort or in development environments.</p>
<p>Discovery results are cached with a configurable TTL in <code>cdb2api</code> to minimize lookup overhead. When failover is triggered, the cache is invalidated and fresh discovery is performed via <code>cdb2_dbinfo()</code>.</p>`

<p><strong>Replication</strong> &mdash; replicants replay logical log records against their own B-trees. Since records are not page-specific, replicants can have different schema versions or page layouts and still stay consistent with the master.</p>

<p><strong>Checkpoints</strong> &mdash; periodically, dirty B-tree pages are flushed to disk and a checkpoint LSN is written. Log records before the checkpoint LSN can be discarded (old log files deleted). A checkpoint happens when the log grows too large or during idle periods.</p>
<p><strong>Recovery</strong> &mdash; on restart, the system finds the last checkpoint LSN, replays all log records from that point forward, and restores to the last committed state.</p>
<div class="callout"><strong>Logical vs. physical.</strong> Physical logging (recording page mutations) is fast but couples replicants to the master's page layout. Logical logging (recording high-level operations) is slower to parse but decouples replicants, enabling rolling schema changes and heterogeneous replica hardware. Comdb2 chose logical logging for this flexibility.</div>`

<p><strong>Master forwarding</strong> &mdash; if a client connects to a replicant and issues a write, osql captures the mutation intent, buffers it, then forwards the block to the master for actual execution. The master applies constraints, executes triggers, and replicates the log to the quorum. This is transparent to the client.</p>
<p><strong>Read-your-writes</strong> &mdash; reads and writes are routed smartly: reads from any live replicant (snapshot-isolated view), writes to the master. A write from a client connected to a replicant is forwarded to the master via osql, then replicated back to that replicant before the client gets a response &mdash; ensuring the client's subsequent reads see its own writes.</p>

<p><strong>Leader election</strong> &mdash; if the master fails (detected via heartbeat timeout), nodes run a Paxos/Raft-like election. The elected master is the node with the most advanced log state (highest LSN). The election requires a quorum to succeed—a tie or partition means no new master until quorum is restored.</p>
<p><strong>Heartbeats</strong> &mdash; the master sends periodic heartbeats to all replicants. If a replicant misses heartbeats, it assumes the master failed and participates in election.</p>
<p><strong>Coherency leases</strong> &mdash; replicants hold time-bounded leases from the master. A lease grants the replicant permission to serve reads with the guarantee that its local snapshot is not stale. On lease expiration or explicit revocation (e.g., if the master sees incompatible writes), the replicant stops serving reads until it re-leases from the master.</p>
<div class="callout"><strong>Why leases?</strong> A network partition could split the cluster. Without leases, a replicant in the partitioned minority might continue serving reads with stale data even though the master and new writes exist on the majority side. Leases prevent this: when the master heartbeat stops, the lease expires, and the replicant goes read-only until reattached to the quorum.</div>`

/* ===== TOOLTIP ===== */
const ttEl = document.getElementById('tooltip');
const ttTitle = document.getElementById('tooltip-title');
const ttDesc = document.getElementById('tooltip-desc');

document.querySelectorAll('.arch-box').forEach(box => {
  box.addEventListener('mouseenter', e => {
    const d = info[box.dataset.id];
    if (!d) return;
    ttTitle.textContent = d.title;
    ttDesc.textContent = d.tip;
    ttEl.classList.add('show');
  });
  box.addEventListener('mousemove', e => {
    const x = Math.min(e.clientX + 14, window.innerWidth - 280);
    const y = e.clientY + 18;
    ttEl.style.left = x + 'px';
    ttEl.style.top = y + 'px';
  });
  box.addEventListener('mouseleave', () => {
    ttEl.classList.remove('show');
  });
});

/* ===== SELECT / DETAIL ===== */
let activeId = null;

function isMobile() {
  return window.innerWidth < 1024;
}

function sel(id) {
  if (activeId === id) {
    activeId = null;
    document.querySelectorAll('.arch-box').forEach(b => b.classList.remove('active'));
    document.getElementById('detail').classList.add('hidden');
    closeDetailDrawer();
    return;
  }
  activeId = id;
  const d = info[id];
  if (!d) return;

  document.querySelectorAll('.arch-box').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });

  const contentHTML = `<span class="detail-phase" style="color:${d.color};background:${d.bg}">${d.label}</span>
    <h2>${d.title}</h2>${d.body}`;

  if (isMobile()) {
    const drawerBody = document.getElementById('detail-drawer-body');
    drawerBody.innerHTML = contentHTML;
    drawerBody.style.setProperty('--accent', d.color);
    drawerBody.style.setProperty('--accentl', d.bg);
    openDetailDrawer();
  } else {
    const panel = document.getElementById('detail');
    const top = document.getElementById('detail-top');
    const body = document.getElementById('detail-body');
    top.style.background = d.color;
    body.innerHTML = contentHTML;
    body.style.setProperty('--accent', d.color);
    body.style.setProperty('--accentl', d.bg);
    panel.classList.remove('hidden');
  }
}

function openDetailDrawer() {
  document.getElementById('detail-drawer').classList.add('show');
}

function closeDetailDrawer() {
  document.getElementById('detail-drawer').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    stopTrace();
    activeId = null;
    document.querySelectorAll('.arch-box').forEach(b => b.classList.remove('active'));
    document.getElementById('detail').classList.add('hidden');
    closeDetailDrawer();
  }
});

window.addEventListener('resize', () => {
  if (activeId && isMobile() && !document.getElementById('detail-drawer').classList.contains('show')) {
    openDetailDrawer();
  }
});

/* ===== TRACE ANIMATION ===== */
const readPath = ['app','cdb2api','sockpool','accept','threadpool','parser','optimizer','vdbe','btree','bufferpool'];
const writePath = ['app','cdb2api','accept','threadpool','parser','optimizer','vdbe','toblock','osql','net'];

let traceTimer = null;
let tracing = false;

function startTrace(mode) {
  stopTrace();
  tracing = true;
  const path = mode === 'read' ? readPath : writePath;
  const label = mode === 'read' ? 'Read Path' : 'Write Path';

  document.getElementById('trace-read').style.display = mode === 'read' ? 'none' : '';
  document.getElementById('trace-write').style.display = mode === 'write' ? 'none' : '';
  document.getElementById('trace-stop').style.display = '';

  // Show the appropriate path visualization
  const readPathGroup = document.getElementById('read-path-group');
  const writePathGroup = document.getElementById('write-path-group');
  const readPathVis = document.getElementById('read-path-visual');
  const writePathVis = document.getElementById('write-path-visual');

  if (mode === 'read') {
    readPathGroup.style.display = 'block';
    writePathGroup.style.display = 'none';
    readPathVis.style.strokeDashoffset = '1000';
  } else {
    readPathGroup.style.display = 'none';
    writePathGroup.style.display = 'block';
    writePathVis.style.strokeDashoffset = '1000';
  }

  let step = 0;
  function tick() {
    if (!tracing || step >= path.length) {
      if (tracing) {
        document.getElementById('trace-progress').textContent = label + ' complete';
        document.getElementById('lua-parser-path').classList.remove('path-flash');
        setTimeout(() => { if (tracing) stopTrace(); }, 2000);
      }
      return;
    }
    const id = path[step];
    document.getElementById('trace-progress').textContent = `${label}: ${step + 1}/${path.length}`;

    // Draw path up to current step
    const pathVis = mode === 'read' ? document.getElementById('read-path-visual') : document.getElementById('write-path-visual');
    try {
      const totalLength = pathVis.getTotalLength();
      const progressRatio = (step + 1) / path.length;
      const offset = 1000 * (1 - progressRatio);
      pathVis.style.strokeDashoffset = offset;
    } catch (e) {
      console.error('Path visualization error:', e);
    }

    // Highlight current, dim others
    document.querySelectorAll('.arch-box').forEach(b => {
      b.classList.remove('active', 'glow');
      const r = b.querySelector('rect');
      if (r) r.style.opacity = '';
    });
    const box = document.querySelector(`.arch-box[data-id="${id}"]`);
    if (box) {
      box.classList.add('active', 'glow');
      const r = box.querySelector('rect');
      if (r) {
        const d = info[id];
        if (d) r.style.filter = `drop-shadow(0 0 10px ${getComputedStyle(document.documentElement).getPropertyValue(d.color.replace('var(','').replace(')',''))})`;
      }
    }

    // Show and flash the lua->parser path when on lua step or after
    const luaParserGroup = document.getElementById('lua-parser-group');
    const luaParserPath = document.getElementById('lua-parser-path');
    const luaIndex = path.indexOf('lua');
    if (luaIndex !== -1 && step >= luaIndex) {
      luaParserGroup.style.display = '';
      if (id === 'lua') {
        luaParserPath.classList.add('path-flash');
      } else {
        luaParserPath.classList.remove('path-flash');
      }
    } else {
      luaParserGroup.style.display = 'none';
    }

    // Show detail
    sel(id);

    step++;
    traceTimer = setTimeout(tick, 1800);
  }
  tick();
}

function stopTrace() {
  tracing = false;
  clearTimeout(traceTimer);
  document.getElementById('trace-read').style.display = '';
  document.getElementById('trace-write').style.display = '';
  document.getElementById('trace-stop').style.display = 'none';
  document.getElementById('trace-progress').textContent = '';
  document.querySelectorAll('.arch-box').forEach(b => {
    b.classList.remove('glow');
    const r = b.querySelector('rect');
    if (r) { r.style.opacity = ''; r.style.filter = ''; }
  });
  document.getElementById('read-path-visual').classList.remove('animate');
  document.getElementById('write-path-visual').classList.remove('animate');
  document.getElementById('read-path-group').style.display = 'none';
  document.getElementById('write-path-group').style.display = 'none';
  document.getElementById('lua-parser-group').style.display = 'none';
}
</script>
</body>
</html>
